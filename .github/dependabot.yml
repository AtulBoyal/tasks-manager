version: 2

updates:
  # Web app dependencies
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Tailwind 4 is a migration (new PostCSS plugin, CSS config, renamed
      # utilities), not a drop-in bump. Remove once both apps are migrated.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
    groups:
      # One PR for all minor/patch bumps instead of one per package
      minor-and-patch:
        update-types: [minor, patch]

  # Chrome extension dependencies
  - package-ecosystem: npm
    directory: /frontend/tasks-extension
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Tailwind 4 is a migration (new PostCSS plugin, CSS config, renamed
      # utilities), not a drop-in bump. Remove once both apps are migrated.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Keeps the SHA-pinned GitHub Actions up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
